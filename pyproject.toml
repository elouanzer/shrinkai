[project]
name = "shrinkai"
version = "0.1.0"
description = "Making Neural Network smaller"
readme = "README.md"
authors = [
    { name = "elouanzer", email = "127297713+elouanzer@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.29.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0.6",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "transformers>=5.16.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "docs",      # Ignore tout le contenu du dossier docs/
    "*.ipynb"    # Ignore tous les notebooks Jupyter du projet
]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
